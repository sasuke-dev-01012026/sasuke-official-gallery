<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel Storytelling – sabdaku_official</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F0F2F5;
    --surface: #FFFFFF;
    --text: #000000;
    --text-secondary: #555555;
    --accent: #3B82F6;
    --accent-light: #EFF6FF;
    --shadow: 0 4px 32px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    --shadow-btn: 0 2px 12px rgba(59,130,246,0.25);
    --radius: 0px;
    --radius-sm: 14px;
    --font: 'Inter', sans-serif;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ── APP SHELL ── */
  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 14px 12px 28px;
    gap: 12px;
  }

  /* ── HEADER ── */
  .header {
    width: 100%;
    max-width: 460px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .header-logo {
    width: 26px; height: 26px;
    background: var(--accent);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
  }
  .header-logo svg { width: 14px; height: 14px; fill: #fff; }
  .header-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }
  .header-sub {
    font-size: 9px;
    font-weight: 400;
    color: var(--text-secondary);
  }
  .slide-counter-pill {
    background: var(--surface);
    border-radius: 40px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    letter-spacing: 0.5px;
  }

  /* ── SLIDE WRAPPER ── */
  .slide-wrapper {
    width: 100%;
    max-width: 360px;
    position: relative;
  }

  /* ── SLIDE CARD ── */
  .slide-card {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ── SLIDE CONTENT ── */
  .slide-inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 60px 36px 52px;
    position: relative;
  }

  .slide-body-wrap {
    flex: 1;
    display: flex;
    align-items: center;
  }

  /* Subtle decorative corner accent */
  .slide-inner::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 80px; height: 80px;
    background: radial-gradient(circle at top right, rgba(59,130,246,0.07), transparent 70%);
    border-radius: 0 var(--radius) 0 0;
    pointer-events: none;
  }

  /* ── SLIDE LABEL (1/8, 2/8 etc) ── */
  .slide-label {
    position: absolute;
    top: 24px; left: 28px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent);
    opacity: 0.75;
  }



  /* ── TYPOGRAPHY ── */
  .slide-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    opacity: 0.8;
  }

  .slide-title {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.22;
    color: var(--text);
    letter-spacing: -0.8px;
    margin-bottom: 24px;
  }

  .slide-title em {
    font-style: normal;
    color: var(--accent);
  }

  .slide-body {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.85;
    color: #000000 !important;
    white-space: pre-line;
    text-align: left;
    position: relative;
  }

  .slide-body.is-empty::before {
    content: attr(data-placeholder);
    color: rgba(100,100,100,0.3);
    font-style: italic;
    pointer-events: none;
    display: block;
  }

  .slide-body strong {
    font-weight: 700;
    color: var(--text);
  }

  .slide-cta {
    margin-top: 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .slide-cta-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    background: var(--accent-light);
    border-radius: 50%;
    animation: bounceDown 1.4s ease-in-out infinite;
  }
  @keyframes bounceDown {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(4px); }
  }

  /* ── DIVIDER LINE ── */
  .slide-divider {
    width: 40px; height: 3px;
    background: var(--accent);
    border-radius: 99px;
    margin: 20px 0;
    opacity: 0.5;
  }

  /* ── CLOSING SLIDE EMOJI ── */
  .slide-emoji {
    font-size: 40px;
    margin-bottom: 20px;
    line-height: 1;
  }

  /* ── BRANDING WATERMARK ── */
  .slide-brand {
    position: absolute;
    bottom: 28px;
    right: 36px;
    font-size: 9.5px;
    font-weight: 500;
    color: #999999;
    letter-spacing: 0.8px;
    opacity: 0.65;
    font-family: var(--font);
  }
  .slide-brand span {
    display: inline-block;
    border-radius: 4px;
    transition: background 0.15s, box-shadow 0.15s, opacity 0.15s;
    cursor: text;
    outline: none;
    position: relative;
  }
  .slide-brand span:empty::before {
    content: attr(data-placeholder);
    color: rgba(153,153,153,0.45);
    pointer-events: none;
    font-style: italic;
  }
  .slide-brand span:hover {
    opacity: 1;
    background: rgba(59,130,246,0.07);
    box-shadow: 0 0 0 1.5px rgba(59,130,246,0.2);
  }
  .slide-brand span:focus {
    opacity: 1;
    background: rgba(59,130,246,0.1);
    box-shadow: 0 0 0 2px rgba(59,130,246,0.35);
  }

  /* Placeholder for slide-body */
  .slide-body:empty::before {
    content: attr(data-placeholder);
    color: rgba(100,100,100,0.3);
    pointer-events: none;
    font-style: italic;
  }

  /* ── PROGRESS BAR ── */
  .slide-progress-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: #F0F0F0;
    border-radius: 0 0 0 0;
    overflow: hidden;
  }
  .slide-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 0;
    transition: width 300ms ease;
  }

  /* ── ANIMATION ── */
  .slide-card { transition: none; }
  .slide-anim-enter {
    animation: slideUp 300ms cubic-bezier(0.34,1.2,0.64,1) both;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .slide-anim-fade {
    animation: fadeIn 300ms ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ── NAVIGATION ── */
  .nav-row {
    width: 100%;
    max-width: 360px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .nav-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
    background: var(--surface);
    box-shadow: 0 1px 8px rgba(0,0,0,0.09);
    color: var(--text);
    flex-shrink: 0;
  }
  .nav-btn:hover { background: #f0f0f0; transform: scale(1.06); }
  .nav-btn:active { transform: scale(0.96); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  /* Dots */
  .nav-dots {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 200px;
  }
  .nav-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #CCCCCC;
    transition: width 0.25s, background 0.25s;
    cursor: pointer;
  }
  .nav-dot.active {
    width: 20px;
    border-radius: 99px;
    background: var(--accent);
  }

  /* ── DOWNLOAD BUTTON ── */
  .download-row {
    width: 100%;
    max-width: 360px;
  }
  .download-btn {
    width: 100%;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: var(--font);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: var(--shadow-btn);
    transition: opacity 0.18s, transform 0.15s, box-shadow 0.18s;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .download-btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(59,130,246,0.35); }
  .download-btn:active { transform: translateY(0); }
  .download-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .download-btn svg { width: 13px; height: 13px; fill: #fff; }

  /* ── FOOTER ── */
  .footer {
    font-size: 9px;
    color: #AAAAAA;
    font-weight: 400;
    text-align: center;
    letter-spacing: 0.3px;
  }

  /* ── EDIT MODE ── */
  .edit-hint {
    width: 100%;
    max-width: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 9px;
    font-weight: 500;
    color: var(--accent);
    opacity: 0.75;
    letter-spacing: 0.3px;
    padding: 1px 0 0;
  }
  .edit-hint svg { width: 10px; height: 10px; flex-shrink: 0; }

  [contenteditable="true"] {
    outline: none;
    cursor: text;
    border-radius: 6px;
    transition: background 0.15s, box-shadow 0.15s;
    position: relative;
  }
  [contenteditable="true"]:hover {
    background: rgba(59,130,246,0.06);
    box-shadow: 0 0 0 1.5px rgba(59,130,246,0.18);
  }
  [contenteditable="true"]:focus {
    background: rgba(59,130,246,0.09);
    box-shadow: 0 0 0 2px rgba(59,130,246,0.35);
  }

  /* Label "Edit" tooltip on hover */
  [contenteditable="true"]::after {
    content: 'Edit';
    position: absolute;
    top: -20px;
    right: 0;
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    padding: 2px 7px;
    border-radius: 99px;
    letter-spacing: 0.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    font-family: var(--font);
    white-space: nowrap;
  }
  [contenteditable="true"]:hover::after { opacity: 1; }

  /* ── RESPONSIVE ── */
  @media (min-width: 480px) {
    .slide-wrapper, .nav-row, .download-row { max-width: 400px; }
    .slide-title { font-size: 30px; }
  }
  @media (min-width: 768px) {
    .slide-wrapper, .nav-row, .download-row { max-width: 420px; }
    .app { padding-top: 20px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      </div>
      <div>
        <div class="header-title">Carousel Maker</div>
        <div class="header-sub" id="headerBrand">@nama_brand_anda</div>
      </div>
    </div>
    <div class="slide-counter-pill" id="counterPill">1 / 8</div>
  </header>

  <!-- Slide -->
  <div class="slide-wrapper">
    <div class="slide-card" id="slideCard">
      <div class="slide-inner" id="slideInner">
        <!-- content injected by JS -->
      </div>
      <div class="slide-brand" id="slideBrand"><span id="slideBrandText" contenteditable="true" spellcheck="false" data-placeholder="@nama_brand_anda">@nama_brand_anda</span></div>
      <div class="slide-progress-bar">
        <div class="slide-progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav-row">
    <button class="nav-btn" id="prevBtn" aria-label="Slide sebelumnya">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="nav-dots" id="navDots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Slide berikutnya">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </nav>

  <!-- Download -->
  <div class="download-row">
    <button class="download-btn" id="downloadBtn">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Download PNG
    </button>
  </div>

  <!-- Edit hint -->
  <div class="edit-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Ketuk teks di slide untuk mengedit langsung
  </div>

  <div class="footer">Preview identik dengan hasil export · 1080 × 1440 px</div>

</div>

<script>
// ─── SLIDE DATA ───────────────────────────────────────────────
const slides = [
  {
    html: `<div class="slide-body-wrap"><div class="slide-body">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.\n\nUt enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</div></div>`
  },
  {
    html: `<div class="slide-body-wrap"><div class="slide-body">Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.\n\nExcepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.</div></div>`
  },
  {
    html: `<div class="slide-body-wrap"><div class="slide-body">Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium.\n\nTotam rem aperiam eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.</div></div>`
  },
  {
    html: `<div class="slide-body-wrap"><div class="slide-body">Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores.\n\nEos qui ratione voluptatem sequi nesciunt neque porro quisquam est, qui dolorem ipsum quia dolor sit amet.</div></div>`
  },
  {
    html: `<div class="slide-body-wrap"><div class="slide-body">At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti.\n\nQuos dolores et quas molestias excepturi sint occaecati cupiditate non provident, similique sunt in culpa.</div></div>`
  },
  {
    html: `<div class="slide-body-wrap"><div class="slide-body">Nam libero tempore, cum soluta nobis est eligendi optio cumque nihil impedit quo minus id quod maxime placeat facere possimus.\n\nOmnis voluptas assumenda est, omnis dolor repellendus temporibus autem quibusdam et aut officiis.</div></div>`
  },
  {
    html: `<div class="slide-body-wrap"><div class="slide-body">Itaque earum rerum hic tenetur a sapiente delectus, ut aut reiciendis voluptatibus maiores alias consequatur.\n\nAut perferendis doloribus asperiores repellat. Quis autem vel eum iure reprehenderit qui in ea voluptate.</div></div>`
  },
  {
    html: `<div class="slide-body-wrap"><div class="slide-body">Temporibus autem quibusdam et aut officiis debitis aut rerum necessitatibus saepe eveniet ut et voluptates.\n\nRepudiandae sint et molestiae non recusandae. Itaque earum rerum hic tenetur a sapiente delectus.</div></div>`
  }
];

// ─── STATE ────────────────────────────────────────────────────
let current = 0;
const total = slides.length;

// ─── DOM REFS ─────────────────────────────────────────────────
const slideInner  = document.getElementById('slideInner');
const slideBrand  = document.getElementById('slideBrand');
const counterPill = document.getElementById('counterPill');
const progressFill= document.getElementById('progressFill');
const navDots     = document.getElementById('navDots');
const prevBtn     = document.getElementById('prevBtn');
const nextBtn     = document.getElementById('nextBtn');
const downloadBtn = document.getElementById('downloadBtn');
const slideCard   = document.getElementById('slideCard');
const headerBrand = document.getElementById('headerBrand');
const slideBrandText = document.getElementById('slideBrandText');

// ─── BRAND SYNC (slide-brand ↔ header-sub) ────────────────────
slideBrandText.addEventListener('input', () => {
  headerBrand.textContent = slideBrandText.textContent;
});
slideBrandText.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') e.preventDefault();
});
slideBrandText.addEventListener('click', e => e.stopPropagation());

// ─── INIT DOTS ────────────────────────────────────────────────
function buildDots() {
  navDots.innerHTML = '';
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'nav-dot' + (i === current ? ' active' : '');
    d.addEventListener('click', () => goTo(i));
    navDots.appendChild(d);
  });
}

// ─── EDITABLE SELECTORS ───────────────────────────────────────
const EDITABLE = [
  '.slide-tag',
  '.slide-title',
  '.slide-body',
  '.slide-emoji',
  '.slide-cta',
];

// ─── SAVE SLIDE HTML BACK TO DATA ─────────────────────────────
function saveCurrentSlide() {
  // Remove auto-injected elements before saving
  slideInner.querySelectorAll('.slide-label').forEach(el => el.remove());
  slides[current].html = slideInner.innerHTML;
  // Re-inject after save so display stays correct
  injectLabel();
}

function injectLabel() {
  if (!slideInner.querySelector('.slide-label')) {
    const lbl = document.createElement('div');
    lbl.className = 'slide-label';
    lbl.textContent = (current + 1) + ' / ' + total;
    slideInner.appendChild(lbl);
  }

}

// ─── MAKE ELEMENTS EDITABLE ───────────────────────────────────
function makeEditable() {
  EDITABLE.forEach(sel => {
    slideInner.querySelectorAll(sel).forEach(el => {
      el.setAttribute('contenteditable', 'true');
      el.setAttribute('spellcheck', 'false');

      // Add placeholder for slide-body
      if (el.classList.contains('slide-body')) {
        el.setAttribute('data-placeholder', 'Ketik teks di sini...');

        const checkEmpty = () => {
          el.classList.toggle('is-empty', el.innerText.trim() === '');
        };
        checkEmpty();
        el.addEventListener('input', checkEmpty);
      }

      // Save on every input (live)
      el.addEventListener('input', () => saveCurrentSlide());

      // Prevent slide navigation when typing
      el.addEventListener('keydown', e => {
        e.stopPropagation();
        if (e.key === 'Enter' && el.classList.contains('slide-tag')) {
          e.preventDefault();
        }
      });

      // Prevent click inside editable from bubbling to swipe/nav
      el.addEventListener('click', e => e.stopPropagation());
    });
  });
}

// ─── RENDER SLIDE ─────────────────────────────────────────────
function renderSlide(anim = 'slideUp') {
  // animate
  slideInner.classList.remove('slide-anim-enter','slide-anim-fade');
  void slideInner.offsetWidth; // reflow
  slideInner.classList.add(anim === 'slideUp' ? 'slide-anim-enter' : 'slide-anim-fade');

  slideInner.innerHTML = slides[current].html;

  // label
  injectLabel();

  // make editable
  makeEditable();

  counterPill.textContent = (current + 1) + ' / ' + total;

  // progress
  progressFill.style.width = ((current + 1) / total * 100) + '%';

  // dots
  document.querySelectorAll('.nav-dot').forEach((d, i) => {
    d.classList.toggle('active', i === current);
  });

  // buttons
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
}

function goTo(i, anim = 'slideUp') {
  if (i < 0 || i >= total) return;
  current = i;
  renderSlide(anim);
}

prevBtn.addEventListener('click', () => goTo(current - 1, 'fade'));
nextBtn.addEventListener('click', () => goTo(current + 1));

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft')  goTo(current - 1, 'fade');
});

// Swipe
let touchStartX = 0;
slideCard.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
slideCard.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) dx < 0 ? goTo(current + 1) : goTo(current - 1, 'fade');
});

// ─── DOWNLOAD ─────────────────────────────────────────────────
// Resolusi diperbesar (2x dari ukuran IG standar 1080×1440) agar detail warna,
// gradasi bayangan, dan ketajaman teks lebih presisi — proporsi & tampilan
// tetap 100% sama dengan card, hanya lebih tajam & file size > 1MB.
const TARGET_W = 2160;
const TARGET_H = 2880;

downloadBtn.addEventListener('click', async () => {
  downloadBtn.disabled = true;
  downloadBtn.textContent = 'Mengunduh...';

  // Hide placeholders & the hover "Edit" tooltip during capture
  const styleHide = document.createElement('style');
  styleHide.id = 'hide-placeholder';
  styleHide.textContent = `
    [data-placeholder]:empty::before, .slide-body.is-empty::before { display: none !important; }
    #slideCard [contenteditable="true"]::after { display: none !important; content: none !important; }
  `;
  document.head.appendChild(styleHide);

  // Ensure brand is visible for capture
  slideBrand.style.display = 'block';

  // Drop the on-screen shadow before capture — it's a UI affordance, not part
  // of the card design, and capturing it would bleed extra pixels/color into
  // the exported PNG that don't exist on the actual card.
  const originalShadow = slideCard.style.boxShadow;
  slideCard.style.boxShadow = 'none';

  // Force crisp, pure-black body text AND pure-white background for the
  // capture itself. This guarantees the exported PNG always has body text
  // exactly #000000 and the card background exactly #FFFFFF, no matter
  // what state (focus, hover, gradient accent, etc.) is on screen.
  const styleForceBlack = document.createElement('style');
  styleForceBlack.id = 'force-black-text';
  styleForceBlack.textContent = `
    #slideCard {
      background: #FFFFFF !important;
    }
    #slideCard .slide-inner::before {
      background: none !important;
    }
    #slideCard .slide-body,
    #slideCard .slide-body *,
    #slideCard .slide-title,
    #slideCard strong {
      color: #000000 !important;
      -webkit-text-fill-color: #000000 !important;
      opacity: 1 !important;
      font-weight: 500 !important;
      text-rendering: geometricPrecision !important;
      -webkit-font-smoothing: antialiased !important;
    }
  `;
  document.head.appendChild(styleForceBlack);

  // Wait until web fonts are fully loaded AND give the browser one extra
  // paint frame. If html2canvas captures before the bold weight is actually
  // ready, it silently falls back to a thinner system font — same black
  // color, but thin strokes anti-alias into a softer, grayish-looking
  // result. This removes that race condition entirely.
  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

  try {
    // Capture directly at the exact target resolution (no supersample +
    // downscale pass). Downscaling a captured canvas with smoothing blends
    // solid black text pixels with the surrounding white background,
    // which visually lightens thin/normal-weight text into gray — exactly
    // the bug we want to avoid. Rendering straight at 1:1 target size keeps
    // text pixels fully opaque black with only html2canvas's own
    // anti-aliasing (no double blur on top).
    const scale = TARGET_W / slideCard.offsetWidth;

    const canvas = await html2canvas(slideCard, {
      scale: scale,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#FFFFFF',
      logging: false,
      width:  slideCard.offsetWidth,
      height: slideCard.offsetHeight,
      imageTimeout: 0,
      removeContainer: false
    });

    const link = document.createElement('a');
    link.download = `carousel-slide-${current + 1}.png`;
    link.href = canvas.toDataURL('image/png', 1.0);
    link.click();
  } catch(err) {
    alert('Gagal mengunduh. Silakan coba lagi.');
    console.error(err);
  }

  // Restore shadow, forced text color, & placeholders
  slideCard.style.boxShadow = originalShadow;
  document.getElementById('force-black-text')?.remove();
  document.getElementById('hide-placeholder')?.remove();

  downloadBtn.disabled = false;
  downloadBtn.innerHTML = `<svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:#fff;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Download PNG`;
});

// ─── BOOT ─────────────────────────────────────────────────────
buildDots();
renderSlide();
</script>
</body>
</html>
