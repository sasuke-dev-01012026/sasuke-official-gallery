<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel Storytelling – sabdaku_official</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F0F2F5;
    --surface: #FFFFFF;
    --text: #111111;
    --text-secondary: #555555;
    --accent: #3B82F6;
    --accent-light: #EFF6FF;
    --shadow: 0 4px 32px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    --shadow-btn: 0 2px 12px rgba(59,130,246,0.25);
    --radius: 24px;
    --radius-sm: 14px;
    --font: 'Poppins', sans-serif;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ── APP SHELL ── */
  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 28px 16px 48px;
    gap: 24px;
  }

  /* ── HEADER ── */
  .header {
    width: 100%;
    max-width: 460px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-logo {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .header-logo svg { width: 20px; height: 20px; fill: #fff; }
  .header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }
  .header-sub {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-secondary);
  }
  .slide-counter-pill {
    background: var(--surface);
    border-radius: 40px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    letter-spacing: 0.5px;
  }

  /* ── SLIDE WRAPPER ── */
  .slide-wrapper {
    width: 100%;
    max-width: 360px;
    position: relative;
  }

  /* ── SLIDE CARD ── */
  .slide-card {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ── SLIDE CONTENT ── */
  .slide-inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 44px 40px 36px;
    position: relative;
  }

  /* Subtle decorative corner accent */
  .slide-inner::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 80px; height: 80px;
    background: radial-gradient(circle at top right, rgba(59,130,246,0.07), transparent 70%);
    border-radius: 0 var(--radius) 0 0;
    pointer-events: none;
  }

  /* ── SLIDE LABEL (1/8, 2/8 etc) ── */
  .slide-label {
    position: absolute;
    top: 28px; left: 40px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.7;
  }

  /* ── TYPOGRAPHY ── */
  .slide-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    opacity: 0.8;
  }

  .slide-title {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.22;
    color: var(--text);
    letter-spacing: -0.8px;
    margin-bottom: 24px;
  }

  .slide-title em {
    font-style: normal;
    color: var(--accent);
  }

  .slide-body {
    font-size: 15px;
    font-weight: 400;
    line-height: 1.85;
    color: #333333;
    white-space: pre-line;
  }

  .slide-body strong {
    font-weight: 700;
    color: var(--text);
  }

  .slide-cta {
    margin-top: 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .slide-cta-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    background: var(--accent-light);
    border-radius: 50%;
    animation: bounceDown 1.4s ease-in-out infinite;
  }
  @keyframes bounceDown {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(4px); }
  }

  /* ── DIVIDER LINE ── */
  .slide-divider {
    width: 40px; height: 3px;
    background: var(--accent);
    border-radius: 99px;
    margin: 20px 0;
    opacity: 0.5;
  }

  /* ── CLOSING SLIDE EMOJI ── */
  .slide-emoji {
    font-size: 40px;
    margin-bottom: 20px;
    line-height: 1;
  }

  /* ── BRANDING WATERMARK ── */
  .slide-brand {
    position: absolute;
    bottom: 28px;
    right: 36px;
    font-size: 9.5px;
    font-weight: 500;
    color: #999999;
    letter-spacing: 0.8px;
    opacity: 0.65;
    font-family: var(--font);
    user-select: none;
  }

  /* ── PROGRESS BAR ── */
  .slide-progress-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: #F0F0F0;
    border-radius: 0 0 0 0;
    overflow: hidden;
  }
  .slide-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 0;
    transition: width 300ms ease;
  }

  /* ── ANIMATION ── */
  .slide-card { transition: none; }
  .slide-anim-enter {
    animation: slideUp 300ms cubic-bezier(0.34,1.2,0.64,1) both;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .slide-anim-fade {
    animation: fadeIn 300ms ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ── NAVIGATION ── */
  .nav-row {
    width: 100%;
    max-width: 360px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .nav-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
    background: var(--surface);
    box-shadow: 0 1px 8px rgba(0,0,0,0.09);
    color: var(--text);
    flex-shrink: 0;
  }
  .nav-btn:hover { background: #f0f0f0; transform: scale(1.06); }
  .nav-btn:active { transform: scale(0.96); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  /* Dots */
  .nav-dots {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 200px;
  }
  .nav-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #CCCCCC;
    transition: width 0.25s, background 0.25s;
    cursor: pointer;
  }
  .nav-dot.active {
    width: 20px;
    border-radius: 99px;
    background: var(--accent);
  }

  /* ── DOWNLOAD BUTTON ── */
  .download-row {
    width: 100%;
    max-width: 360px;
  }
  .download-btn {
    width: 100%;
    padding: 16px 24px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: var(--shadow-btn);
    transition: opacity 0.18s, transform 0.15s, box-shadow 0.18s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .download-btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(59,130,246,0.35); }
  .download-btn:active { transform: translateY(0); }
  .download-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .download-btn svg { width: 18px; height: 18px; fill: #fff; }

  /* ── FOOTER ── */
  .footer {
    font-size: 11px;
    color: #AAAAAA;
    font-weight: 400;
    text-align: center;
    letter-spacing: 0.3px;
  }

  /* ── RESPONSIVE ── */
  @media (min-width: 480px) {
    .slide-wrapper, .nav-row, .download-row { max-width: 400px; }
    .slide-title { font-size: 30px; }
  }
  @media (min-width: 768px) {
    .slide-wrapper, .nav-row, .download-row { max-width: 420px; }
    .app { padding-top: 48px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      </div>
      <div>
        <div class="header-title">Carousel Maker</div>
        <div class="header-sub">sabdaku_official</div>
      </div>
    </div>
    <div class="slide-counter-pill" id="counterPill">1 / 8</div>
  </header>

  <!-- Slide -->
  <div class="slide-wrapper">
    <div class="slide-card" id="slideCard">
      <div class="slide-inner" id="slideInner">
        <!-- content injected by JS -->
      </div>
      <div class="slide-brand" id="slideBrand">© sabdaku_official</div>
      <div class="slide-progress-bar">
        <div class="slide-progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav-row">
    <button class="nav-btn" id="prevBtn" aria-label="Slide sebelumnya">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="nav-dots" id="navDots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Slide berikutnya">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </nav>

  <!-- Download -->
  <div class="download-row">
    <button class="download-btn" id="downloadBtn">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Download PNG
    </button>
  </div>

  <div class="footer">Preview identik dengan hasil export · 1080 × 1440 px</div>

</div>

<script>
// ─── SLIDE DATA ───────────────────────────────────────────────
const slides = [
  {
    tag: 'Kisah Nyata',
    type: 'hook',
    html: `
      <div class="slide-tag">Kisah Nyata</div>
      <div class="slide-title">Aku Menolak<br>Pulang Kampung<em>...</em></div>
      <div class="slide-divider"></div>
      <div class="slide-body">Sampai Ibu Meneleponku\nPukul <strong>02.17</strong> Dini Hari.</div>
      <div class="slide-cta">
        <div class="slide-cta-arrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        </div>
        Swipe untuk baca kisahnya
      </div>
    `
  },
  {
    type: 'body',
    html: `
      <div class="slide-tag">Bagian 1</div>
      <div class="slide-body">Sudah hampir <strong>3 tahun</strong>\naku merantau di Jakarta.\n\nAku selalu punya alasan\nuntuk tidak pulang.\n\nKatanya sibuk.\nKatanya pekerjaan banyak.\n\nPadahal bukan itu alasannya.</div>
    `
  },
  {
    type: 'body',
    html: `
      <div class="slide-tag">Bagian 2</div>
      <div class="slide-title" style="font-size:26px;">Aku sebenarnya <em>malu.</em></div>
      <div class="slide-body">Karena selama merantau,\nhidupku tidak sebaik yang\ndibayangkan orang-orang.\n\nGaji pas-pasan.\nTabungan hampir tidak ada.\n\nDan aku merasa <strong>gagal.</strong></div>
    `
  },
  {
    type: 'body',
    html: `
      <div class="slide-tag">Bagian 3</div>
      <div class="slide-body">Setiap kali ibu bertanya:\n\n<strong>"Kapan pulang?"</strong>\n\nAku selalu menjawab:\n\n<em style="color:#333;font-style:italic;font-size:14px;">"Nanti ya Bu,\nlagi banyak kerjaan."</em>\n\nPadahal aku hanya\nbelum siap bertemu mereka.</div>
    `
  },
  {
    type: 'body',
    html: `
      <div class="slide-tag">Titik Balik</div>
      <div class="slide-title" style="font-size:26px;">Sampai suatu <em>malam.</em></div>
      <div class="slide-body">Telepon dari ibu masuk.\n\nPukul <strong>02.17.</strong>\n\nSuara ibu terdengar pelan.\n\n<strong>"Nak...\nkalau sempat pulang ya."</strong>\n\nSaat itu aku merasa\nada sesuatu yang berbeda.</div>
    `
  },
  {
    type: 'body',
    html: `
      <div class="slide-tag">Keputusan</div>
      <div class="slide-title" style="font-size:28px;">Besok paginya<br>aku langsung<br><em>membeli tiket.</em></div>
      <div class="slide-divider"></div>
      <div class="slide-body">Perjalanan yang selama ini\nselalu aku tunda.\n\nAku pulang.\n\nDengan perasaan campur aduk.</div>
    `
  },
  {
    type: 'body',
    html: `
      <div class="slide-tag">Sampai Rumah</div>
      <div class="slide-body">Saat sampai rumah,\naku melihat ibu <strong>tersenyum.</strong>\n\nTidak ada pertanyaan\ntentang pekerjaan.\n\nTidak ada pertanyaan\ntentang uang.\n\nIbu hanya berkata:\n\n<strong>"Yang penting\nkamu sehat."</strong></div>
    `
  },
  {
    type: 'closing',
    html: `
      <div class="slide-emoji">❤️</div>
      <div class="slide-tag">Penutup</div>
      <div class="slide-body" style="font-size:14.5px;">Kadang kita terlalu sibuk\nmengejar validasi dunia.\n\nSampai lupa bahwa\nada seseorang di rumah\nyang hanya ingin melihat\nkita <strong>baik-baik saja.</strong>\n\nKalau kamu masih punya kesempatan,\nsempatkan <strong>pulang.</strong></div>
    `
  }
];

// ─── STATE ────────────────────────────────────────────────────
let current = 0;
const total = slides.length;

// ─── DOM REFS ─────────────────────────────────────────────────
const slideInner  = document.getElementById('slideInner');
const slideBrand  = document.getElementById('slideBrand');
const counterPill = document.getElementById('counterPill');
const progressFill= document.getElementById('progressFill');
const navDots     = document.getElementById('navDots');
const prevBtn     = document.getElementById('prevBtn');
const nextBtn     = document.getElementById('nextBtn');
const downloadBtn = document.getElementById('downloadBtn');
const slideCard   = document.getElementById('slideCard');

// ─── INIT DOTS ────────────────────────────────────────────────
function buildDots() {
  navDots.innerHTML = '';
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'nav-dot' + (i === current ? ' active' : '');
    d.addEventListener('click', () => goTo(i));
    navDots.appendChild(d);
  });
}

// ─── RENDER SLIDE ─────────────────────────────────────────────
function renderSlide(anim = 'slideUp') {
  // animate
  slideInner.classList.remove('slide-anim-enter','slide-anim-fade');
  void slideInner.offsetWidth; // reflow
  slideInner.classList.add(anim === 'slideUp' ? 'slide-anim-enter' : 'slide-anim-fade');

  slideInner.innerHTML = slides[current].html;

  // label
  const label = slideInner.querySelector('.slide-label');
  if (!label) {
    const lbl = document.createElement('div');
    lbl.className = 'slide-label';
    lbl.textContent = (current + 1) + ' / ' + total;
    slideInner.insertBefore(lbl, slideInner.firstChild);
  }

  counterPill.textContent = (current + 1) + ' / ' + total;

  // progress
  progressFill.style.width = ((current + 1) / total * 100) + '%';

  // dots
  document.querySelectorAll('.nav-dot').forEach((d, i) => {
    d.classList.toggle('active', i === current);
  });

  // buttons
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
}

function goTo(i, anim = 'slideUp') {
  if (i < 0 || i >= total) return;
  current = i;
  renderSlide(anim);
}

prevBtn.addEventListener('click', () => goTo(current - 1, 'fade'));
nextBtn.addEventListener('click', () => goTo(current + 1));

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft')  goTo(current - 1, 'fade');
});

// Swipe
let touchStartX = 0;
slideCard.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
slideCard.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) dx < 0 ? goTo(current + 1) : goTo(current - 1, 'fade');
});

// ─── DOWNLOAD ─────────────────────────────────────────────────
downloadBtn.addEventListener('click', async () => {
  downloadBtn.disabled = true;
  downloadBtn.textContent = 'Mengunduh...';

  // Ensure brand is visible for capture
  slideBrand.style.display = 'block';

  try {
    const canvas = await html2canvas(slideCard, {
      scale: 3,                  // 3× → 1080×1440 at 360px preview
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#FFFFFF',
      logging: false,
      width:  slideCard.offsetWidth,
      height: slideCard.offsetHeight,
      imageTimeout: 0,
      removeContainer: false
    });

    // Scale to exact 1080×1440
    const out = document.createElement('canvas');
    out.width  = 1080;
    out.height = 1440;
    const ctx = out.getContext('2d');
    ctx.drawImage(canvas, 0, 0, 1080, 1440);

    const link = document.createElement('a');
    link.download = `carousel-slide-${current + 1}.png`;
    link.href = out.toDataURL('image/png', 1.0);
    link.click();
  } catch(err) {
    alert('Gagal mengunduh. Silakan coba lagi.');
    console.error(err);
  }

  downloadBtn.disabled = false;
  downloadBtn.innerHTML = `<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#fff;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Download PNG`;
});

// ─── BOOT ─────────────────────────────────────────────────────
buildDots();
renderSlide();
</script>
</body>
</html>
