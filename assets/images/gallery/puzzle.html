<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Puzzle 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rose:    #e8476a;
    --blush:   #f9b8c7;
    --petal:   #fce8ee;
    --cream:   #fff5f7;
    --deep:    #c0334d;
    --text:    #5a1e2e;
    --shadow:  rgba(200, 50, 80, 0.18);
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fce8ee 0%, #fff0f3 40%, #fde8f0 70%, #f9d6e4 100%);
    font-family: 'Lato', sans-serif;
    color: var(--text);
    overflow-x: hidden;
    padding: 20px;
  }

  /* Floating petals background */
  .petals {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
  }
  .petal {
    position: absolute;
    width: 10px; height: 14px;
    background: radial-gradient(ellipse, var(--blush) 0%, var(--rose) 100%);
    border-radius: 50% 0 50% 0;
    opacity: 0.35;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.35; }
    90%  { opacity: 0.2; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
  }

  .card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border: 1.5px solid rgba(255,255,255,0.9);
    border-radius: 28px;
    padding: 32px 28px 28px;
    box-shadow: 0 8px 40px var(--shadow), 0 2px 8px rgba(255,255,255,0.6) inset;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 700;
    color: var(--deep);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 0.82rem;
    color: var(--rose);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 20px;
    font-weight: 300;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 18px;
  }
  .stat {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .stat-val {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--rose);
    line-height: 1;
  }
  .stat-label {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text);
    opacity: 0.7;
  }

  /* Puzzle board */
  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    background: transparent;
    border-radius: 0;
    padding: 0;
    box-shadow: 0 4px 20px var(--shadow);
    margin: 0 auto 20px;
    width: min(340px, 90vw);
    height: min(340px, 90vw);
    touch-action: none;
    user-select: none;
    overflow: hidden;
    border-radius: 12px;
  }

  .tile {
    position: relative;
    border-radius: 0;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(.4,0,.2,1), box-shadow 0.18s;
    background: var(--petal);
    box-shadow: none;
  }
  .tile:hover:not(.empty) {
    transform: scale(1.04);
    z-index: 2;
  }
  .tile.empty {
    background: rgba(232,71,106,0.12);
    cursor: default;
  }
  .tile canvas {
    width: 100%; height: 100%;
    display: block;
    border-radius: 0;
  }
  .tile.moving {
    transform: scale(1.06);
    z-index: 10;
    box-shadow: 0 8px 24px var(--shadow);
  }

  /* Buttons */
  .btn {
    background: linear-gradient(135deg, var(--rose), var(--deep));
    color: #fff;
    border: none;
    padding: 11px 32px;
    border-radius: 50px;
    font-family: 'Lato', sans-serif;
    font-size: 0.88rem;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    box-shadow: 0 4px 16px rgba(200,50,80,0.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(200,50,80,0.4); }
  .btn:active { transform: translateY(0); opacity: 0.9; }

  /* Win overlay */
  #win-overlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(255,240,244,0.88);
    backdrop-filter: blur(10px);
    border-radius: 28px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 20;
    animation: fadeIn 0.4s ease;
  }
  #win-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }

  .win-emoji { font-size: 3rem; animation: bounce 0.6s ease infinite alternate; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  .win-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--deep);
    text-align: center;
  }
  .win-sub {
    font-size: 0.88rem;
    color: var(--rose);
    letter-spacing: 0.08em;
    text-align: center;
  }
  .win-preview {
    width: 120px; height: 120px;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 4px 16px var(--shadow);
    border: 3px solid var(--blush);
  }

  /* Divider */
  .divider {
    width: 40px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--blush), transparent);
    margin: 0 auto 20px;
  }
</style>
</head>
<body>

<div class="petals" id="petals"></div>

<div class="card" id="card">

  <h1>💕 Puzzle Cinta</h1>
  <p class="subtitle">Susun potongan dengan hati</p>
  <div class="divider"></div>

  <div class="stats">
    <div class="stat">
      <span class="stat-val" id="moves">0</span>
      <span class="stat-label">Langkah</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="timer">0:00</span>
      <span class="stat-label">Waktu</span>
    </div>
  </div>

  <div id="board"></div>
  <button class="btn" onclick="initPuzzle()">🔀 Acak Ulang</button>

  <!-- Win overlay -->
  <div id="win-overlay">
    <div class="win-emoji">🎉</div>
    <div class="win-title">Puzzle Selesai!</div>
    <canvas id="win-preview" class="win-preview" width="120" height="120"></canvas>
    <div class="win-sub" id="win-msg"></div>
    <button class="btn" onclick="initPuzzle()">🔀 Main Lagi</button>
  </div>
</div>
